# LEGACY platform (app.main audit web UI) — SUPERSEDED by Dockerfile.serve /
# docker-compose.serve.yml, which ship the current verify web UI.
#
# This legacy API has NO authentication. It must NOT be published on a public
# interface: the port is bound to the host loopback only below. For a hosted
# verify service use `docker compose -f docker-compose.serve.yml up -d --build`
# (127.0.0.1:8766) and put Caddy/Nginx + TLS in front if you need LAN/VPS
# reachability.
version: '3.8'

services:
  transit-truth:
    build: .
    # Run as the same UID/GID the Dockerfile's appuser uses (1000:1000).
    # The bind mount ./data:/app/data is owned by the host directory rather
    # than the image's chown; pinning the user here keeps the SQLite DB
    # writable regardless of who created ./data on the host (N5).
    user: "1000:1000"
    ports:
      # Bind host 127.0.0.1 explicitly (mirrors docker-compose.serve.yml); do
      # NOT publish 0.0.0.0:8000 — this legacy API has no authentication.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - REQUEST_TIMEOUT=30
      - MAX_RETRIES=2
      - CONCURRENT_REQUESTS=5
