version: '3.8'

services:
  transit-truth:
    build: .
    # Run as the same UID/GID the Dockerfile's appuser uses (1000:1000).
    # The bind mount ./data:/app/data is owned by the host directory rather
    # than the image's chown; pinning the user here keeps the SQLite DB
    # writable regardless of who created ./data on the host (N5).
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - REQUEST_TIMEOUT=30
      - MAX_RETRIES=2
      - CONCURRENT_REQUESTS=5
