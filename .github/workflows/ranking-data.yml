name: ranking-data

# Regenerates docs/data/audit_results.json so the public leaderboard can be a
# static file. The browser never calls api.github.com: unauthenticated GitHub
# allows 60 req/hour per IP, and on shared networks that turned the board into
# a rate-limit error for real visitors.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_ranking_data.py"
      - ".github/workflows/ranking-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: ranking-data
  # Do not cancel an in-flight submission: the cancelled run never reaches the
  # comment step, so that submitter would get no feedback at all. Queue instead.
  cancel-in-progress: false

jobs:
  build:
    # Bug reports and feature requests also fire issues events; parsing them
    # costs a run and writes nothing. Only audit submissions get this far.
    # GitHub Actions expressions have no toLower(); the template auto-applies
    # the label, and a mis-titled issue gets it from audit-issue-label.yml,
    # whose `labeled` event re-enters here.
    if: >
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'audit-result')
    runs-on: ubuntu-latest
    # Normal path is under two minutes. Cap it so one hung run cannot block
    # every queued submission for GitHub's default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild snapshot
        id: rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_ranking_data.py
      - name: Commit if changed
        id: publish
        run: |
          if git diff --quiet -- docs/data/audit_results.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit_results.json
          git commit -m "chore: refresh leaderboard snapshot"
          # A human push can land between checkout and push; rebase keeps the
          # run from failing (and skipping the submitter comment) on that race.
          git pull --rebase origin main
          git push

      # The template used to promise automatic closure and then say nothing;
      # a submitter could not tell a successful parse from a silent drop.
      # One durable comment, rewritten in place, closes that loop.
      - name: Tell the submitter what happened
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tt-ranking-bot -->';
            const number = context.payload.issue.number;
            // The entry text comes from a user-controlled issue body. Escape
            // Markdown punctuation, flatten newlines and break @-mentions so a
            // relay name can neither inject formatting nor ping a real account.
            const safe = (value) => String(value ?? '')
              .slice(0, 80)
              .replace(/\r?\n/g, ' ')
              .replace(/[\\`*_{}[\]()#+\-.!|<>]/g, '\\$&')
              .replace(/@/g, '@\u200b');
            let snapshotOk = true;
            let data;
            try {
              data = JSON.parse(
                fs.readFileSync('docs/data/audit_results.json', 'utf8')
              );
            } catch (err) {
              // checkout failed or the snapshot is unreadable: still reply,
              // instead of dying before the comment is posted.
              core.warning(`snapshot unavailable: ${err.message}`);
              snapshotOk = false;
              data = { entries: [] };
            }
            const entry = (data.entries || []).find(e => e.issue_number === number);
            const rebuildOk = process.env.REBUILD_OUTCOME === 'success';
            const publishOk = process.env.PUBLISH_OUTCOME === 'success';

            let body;
            if (!rebuildOk || !snapshotOk) {
              body = `${marker}
            这次**没有跑完**（脚本或运行环境报错，常见原因是 GitHub API 限流、网络或 checkout 失败）。
            你的提交没有丢；维护者会重跑，或你编辑一次本 Issue 也能触发重试。`;
            } else if (entry && publishOk) {
              body = `${marker}
            已收录到公开榜单：**${safe(entry.relay)} / ${safe(entry.model)}**，总分 **${safe(entry.overall_score)}**（${safe(entry.trust_level)}）。
            快照会在 1–2 分钟内刷新；页面不签发 pass，判定边界以报告为准。`;
            } else if (entry && !publishOk) {
              body = `${marker}
            已解析成功，但公开快照这次**没有发布成功**（可能是推送冲突或网络失败）。
            你的提交没有丢；维护者会重跑 workflow，或你编辑一次本 Issue 也能触发重试。`;
            } else {
              body = `${marker}
            这条提交**没有进入榜单**：必填字段缺失，或分数/延迟等字段无法解析。
            请按模板补齐后直接编辑本 Issue；不会自动关闭，也不需要重新开一条。`;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: number, per_page: 100 }
            );
            const old = comments.find(c => (c.body || '').includes(marker));
            if (old) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: old.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: number, body,
              });
            }

