name: ranking-data

# Regenerates docs/data/audit_results.json so the public leaderboard can be a
# static file. The browser never calls api.github.com: unauthenticated GitHub
# allows 60 req/hour per IP, and on shared networks that turned the board into
# a rate-limit error for real visitors.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_ranking_data.py"
      - ".github/workflows/ranking-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: ranking-data
  cancel-in-progress: true

jobs:
  build:
    # Bug reports and feature requests also fire issues events; parsing them
    # costs a run and writes nothing. Only audit submissions get this far.
    # GitHub Actions expressions have no toLower(); the template auto-applies
    # the label, and a mis-titled issue gets it from audit-issue-label.yml,
    # whose `labeled` event re-enters here.
    if: >
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'audit-result')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_ranking_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/audit_results.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit_results.json
          git commit -m "chore: refresh leaderboard snapshot"
          # A human push can land between checkout and push; rebase keeps the
          # run from failing (and skipping the submitter comment) on that race.
          git pull --rebase origin main
          git push

      # The template used to promise automatic closure and then say nothing;
      # a submitter could not tell a successful parse from a silent drop.
      # One durable comment, rewritten in place, closes that loop.
      - name: Tell the submitter what happened
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tt-ranking-bot -->';
            const number = context.payload.issue.number;
            // The entry text comes from a user-controlled issue body. Escape
            // Markdown punctuation and break @-mentions so a relay name can
            // neither inject formatting nor ping a real account.
            const safe = (value) => String(value ?? '')
              .slice(0, 80)
              .replace(/[\\`*_{}[\]()#+\-.!|<>]/g, '\\$&')
              .replace(/@/g, '@\u200b');
            const data = JSON.parse(
              fs.readFileSync('docs/data/audit_results.json', 'utf8')
            );
            const entry = (data.entries || []).find(e => e.issue_number === number);

            let body;
            if (entry) {
              body = `${marker}
            已收录到公开榜单：**${safe(entry.relay)} / ${safe(entry.model)}**，总分 **${safe(entry.overall_score)}**（${safe(entry.trust_level)}）。
            快照会在 1–2 分钟内刷新；页面不签发 pass，判定边界以报告为准。`;
            } else {
              body = `${marker}
            这条提交**没有进入榜单**：必填字段缺失，或分数/延迟等字段无法解析。
            请按模板补齐后直接编辑本 Issue；不会自动关闭，也不需要重新开一条。`;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: number, per_page: 100 }
            );
            const old = comments.find(c => (c.body || '').includes(marker));
            if (old) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: old.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: number, body,
              });
            }

