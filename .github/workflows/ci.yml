name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check import sanity
        run: |
          cd backend
          python -c "from app.main import app; print('App imports OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned to the versions the repo was formatted with so CI can never
      # drift on formatting rules.
      - name: Install linters
        run: pip install black==26.10.1 isort==9.0.2 flake8

      # Hard gates: the whole repo must stay formatted.
      - name: black --check
        run: black --check .

      - name: isort --check-only
        run: isort --check-only .

      # flake8 is intentionally non-blocking: the pre-existing baseline of
      # violations (mostly long strings/comments) has not yet been cleared.
      # The count is recorded in docs; do not let it grow.
      - name: flake8 (baseline, non-blocking)
        run: |
          cd backend
          flake8 app/ --max-line-length=120 --extend-ignore=E203,W503 \
            || echo "::warning::flake8 still above the pre-existing baseline (see fixes_transit_round1.md); not yet a hard gate"
