# Canonical build config for the transit-truth package.
# `pip install .` / `python -m build` run from the repo root and build this file.
# backend/pyproject.toml is the legacy in-backend development config (kept for
# running pytest/tooling from backend/) and must stay version-synced with this
# file -- test_v045_version_tokenizer.py enforces that.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-truth"
version = "0.5.9"
description = "Statelessly verify that the model an OpenAI-compatible endpoint claims to serve is the model it actually serves."
readme = "README.en.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "dafahaha", email = "156556011+dafahaha@users.noreply.github.com"},
]
keywords = [
    "llm", "openai-api", "api-gateway", "model-verification",
    "llm-security", "audit", "fingerprinting", "relay",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    # Pinned to the CI hard-gate versions so local formatting cannot drift.
    "black==26.10.1",
    "isort==9.0.2",
]
# `reference-server` loads a REAL local tokenizer (downloaded from HF_ENDPOINT,
# default hf-mirror.com) for genuine token-count fingerprints. Without this
# extra the reference-server still runs, but as an explicitly-labelled plumbing
# stub (hash placeholders, fixed behavioral strings) -- it can never certify
# anything in that mode.
reference = [
    "tokenizers>=0.15.0",
]

[project.scripts]
transit-truth = "app.cli:main"

[project.urls]
Homepage = "https://dafahaha.github.io/transit-truth/"
Repository = "https://github.com/dafahaha/transit-truth"
Issues = "https://github.com/dafahaha/transit-truth/issues"
Changelog = "https://github.com/dafahaha/transit-truth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dafahaha/transit-truth/blob/main/README.en.md"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
# NOTE: the legacy online platform (app.main + app.api) is intentionally
# INCLUDED here so that sdist / `pip install .` ship a complete, importable
# source tree. The PyPI wheel is trimmed post-build by
# scripts/_strip_wheel_legacy.py (wheel-only, RECORD-aware).

# Ship the reference catalog mirror (see sync_reference_data.py) so that
# `transit-truth verify` works out of the box after a plain pip install.
[tool.setuptools.package-data]
"app.verify" = [
    "data/baselines/*.json",
    "data/fingerprints/*.json",
    "webapp/*.html",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
