<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TransitTruth Banner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 640px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            overflow: hidden;
            position: relative;
            transform-origin: top left;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 极淡的背景纹理——只有在仔细看时才会注意到 */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 70% 30%, rgba(0, 113, 227, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 80px 100px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 顶部：Logo + 名称 */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            width: 44px;
            height: 44px;
            background: #1d1d1f;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.3px;
        }

        /* 中间：主标题区 */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 780px;
        }
        .hero-title {
            font-size: 72px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -2px;
            line-height: 1.05;
            margin-bottom: 24px;
        }
        .hero-title .accent {
            color: #0071e3;
        }
        .hero-subtitle {
            font-size: 28px;
            font-weight: 400;
            color: #86868b;
            letter-spacing: -0.5px;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        .hero-desc {
            font-size: 20px;
            font-weight: 400;
            color: #86868b;
            letter-spacing: -0.2px;
            line-height: 1.4;
        }

        /* 右侧：简洁的数据卡片 */
        .side-card {
            position: absolute;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: #f5f5f7;
            border-radius: 20px;
            padding: 32px 28px;
        }
        .side-card-label {
            font-size: 14px;
            font-weight: 500;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        .side-card-stat {
            margin-bottom: 24px;
        }
        .side-card-stat:last-child {
            margin-bottom: 0;
        }
        .side-card-value {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .side-card-value .unit {
            font-size: 20px;
            font-weight: 500;
            color: #86868b;
        }
        .side-card-desc {
            font-size: 14px;
            font-weight: 400;
            color: #86868b;
            line-height: 1.3;
        }
        .side-card-divider {
            height: 1px;
            background: #d2d2d7;
            margin: 20px 0;
        }

        /* 底部：链接 */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 32px;
            border-top: 1px solid #f0f0f0;
        }
        .footer-link {
            font-size: 16px;
            font-weight: 400;
            color: #0071e3;
            text-decoration: none;
            letter-spacing: -0.2px;
        }
        .footer-link:hover {
            text-decoration: underline;
        }
        .footer-tag {
            font-size: 14px;
            font-weight: 400;
            color: #86868b;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo">🛡</div>
            <div class="brand-name">TransitTruth</div>
        </div>

        <!-- 中间主标题 -->
        <div class="hero">
            <div class="hero-title">
                你用的 <span class="accent">GPT-4</span>，<br>是真的吗？
            </div>
            <div class="hero-subtitle">
                用行为指纹，30 秒验明正身。
            </div>
            <div class="hero-desc">
                开源的 AI API 安全审计平台 · 行为指纹 · Token 计费审计 · 社区排行榜
            </div>
        </div>

        <!-- 右侧数据卡片 -->
        <div class="side-card">
            <div class="side-card-label">Behavioral Fingerprint</div>
            <div class="side-card-stat">
                <div class="side-card-value">90<span class="unit">%</span></div>
                <div class="side-card-desc">单探针区分 gpt-4o 与 gpt-4o-mini 的准确率</div>
            </div>
            <div class="side-card-divider"></div>
            <div class="side-card-stat">
                <div class="side-card-value">2600<span class="unit">+</span></div>
                <div class="side-card-desc">真实 API 请求采集的基准数据</div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <a class="footer-link" href="https://github.com/dafahaha/transit-truth">github.com/dafahaha/transit-truth</a>
            <div class="footer-tag">Open Source · MIT License</div>
        </div>
    </div>
</body>
</html>
